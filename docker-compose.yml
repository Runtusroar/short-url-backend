services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shorturl
      POSTGRES_PASSWORD: shorturl
      POSTGRES_DB: shorturl
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "18543:5432"
    networks:
      - short_url_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl -d shorturl"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    networks:
      - short_url_network
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${GEOIPUPDATE_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${GEOIPUPDATE_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: 24
    volumes:
      - geoipdata:/usr/share/GeoIP

  app:
    build: .
    container_name: short_url_app
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://shorturl:shorturl@db:5432/shorturl}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/usr/share/GeoIP/GeoLite2-Country.mmdb}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      PUBLIC_SHORT_URL_SCHEME: ${PUBLIC_SHORT_URL_SCHEME:-http}
      PUBLIC_SHORT_URL_PORT: ${PUBLIC_SHORT_URL_PORT:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      IP_REPUTATION_TTL_HOURS: ${IP_REPUTATION_TTL_HOURS:-168}
      MAXMIND_TIMEOUT_SECONDS: ${MAXMIND_TIMEOUT_SECONDS:-1.5}
    volumes:
      - geoipdata:/usr/share/GeoIP:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - short_url_network

volumes:
  pgdata:
  redisdata:
  geoipdata:

networks:
  short_url_network:
    name: short_url_network
    driver: bridge
